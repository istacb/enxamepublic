name: ENXAME CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-por libtesseract-dev
      
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install tesseract tesseract-lang
      
      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          winget install --id UB-Mannheim.tesseract --accept-source-agreements --accept-package-agreements
          # Adicionar tesseract ao PATH
          echo "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      
      - name: Install Python dependencies
        run: |
          cd bees
          pip install -e ".[dev]"
      
      - name: Run tests
        run: |
          cd bees
          python -m pytest tests/ -v --tb=short
      
      - name: Run linter (ruff)
        run: |
          cd bees
          ruff check .
      
      - name: Run type checker (mypy)
        run: |
          cd bees
          mypy .

  build-installers:
    name: Build Installers (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-por libtesseract-dev
      
      - name: Install build dependencies
        run: |
          pip install pyinstaller
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get install -y fakeroot dpkg-dev
          fi
      
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: |
          cd bees/install
          python build_installer.py --windows
      
      - name: Build macOS installer
        if: runner.os == 'macOS'
        run: |
          cd bees/install
          python build_installer.py --macos
      
      - name: Build Linux installer
        if: runner.os == 'Linux'
        run: |
          cd bees/install
          python build_installer.py --linux
      
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            bees/install/dist/*.exe
            bees/install/dist/*.msi
            bees/install/dist/*.pkg
            bees/install/dist/*.app
            bees/install/dist/*.deb
            bees/install/dist/*.tar.gz
          retention-days: 30

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      
      - name: Install linting tools
        run: pip install ruff mypy
      
      - name: Run ruff
        run: |
          cd bees
          ruff check .
      
      - name: Run mypy
        run: |
          cd bees
          mypy .

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Run bandit
        run: |
          pip install bandit
          bandit -r bees/ -f json -o bandit-report.json || true
      
      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit -r bees/requirements.txt -f json -o pip-audit-report.json || true
      
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json