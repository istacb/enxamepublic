<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enxame — Hive</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <header class="topbar" role="banner">
    <div class="topbar-left">
      <div class="brand" aria-label="Enxame">ENXAME</div>
      <div class="cluster-status" id="cluster-label" aria-live="polite">cluster: —</div>
    </div>
    <div class="topbar-center">
      <div class="search-wrap" role="search">
        <label for="global-search" class="sr-only">Buscar na rede</label>
        <input type="search" id="global-search" placeholder="Buscar peers, modelos, docs…" aria-label="Busca global">
        <span class="search-icon" aria-hidden="true">🔍</span>
      </div>
    </div>
    <div class="topbar-right">
      <button id="discover-btn" class="btn btn-ghost" aria-label="Descobrir peers na rede">DESCOBRIR REDE</button>
      <button id="pause-all" class="btn btn-danger" aria-label="Pausar todos os nós" aria-pressed="false">PAUSAR TODOS</button>
      <button id="settings-btn" class="btn btn-ghost" aria-label="Configurações">⚙️</button>
    </div>
  </header>

  <main class="main-grid" role="main">
    <aside class="sidebar" id="sidebar" role="complementary" aria-label="Painel de controle da colmeia">
      <div class="sidebar-header">
        <h2>COLMEIA</h2>
        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Fechar painel lateral" aria-expanded="true" hidden>◀</button>
      </div>

      <section class="panel" aria-labelledby="health-title">
        <h3 id="health-title" class="panel-title">SAÚDE DOS NÓS</h3>
        <div class="node-list" id="node-list" role="list" aria-label="Lista de abelhas ativas"></div>
      </section>

      <section class="panel" aria-labelledby="conn-title">
        <h3 id="conn-title" class="panel-title">CONEXÃO</h3>
        <div class="connection-grid" id="connection-grid" role="list" aria-label="Status de conexão por nó">
          <!-- preenchido via JS -->
        </div>
      </section>

      <section class="panel" aria-labelledby="model-title">
        <h3 id="model-title" class="panel-title">MODELOS</h3>
        <div class="model-list" id="model-list" role="list" aria-label="Modelos Ollama disponíveis"></div>
      </section>

      <section class="panel" aria-labelledby="stats-title">
        <h3 id="stats-title" class="panel-title">ESTATÍSTICAS</h3>
        <div class="stats-grid" id="stats-grid" role="list" aria-label="Contadores globais">
          <div class="stat" role="listitem">
            <span class="stat-value" id="c-tasks">0</span>
            <span class="stat-label">tarefas</span>
          </div>
          <div class="stat" role="listitem">
            <span class="stat-value" id="c-calls">0</span>
            <span class="stat-label">chamadas</span>
          </div>
          <div class="stat" role="listitem">
            <span class="stat-value" id="c-nacks">0</span>
            <span class="stat-label">NACKs</span>
          </div>
          <div class="stat" role="listitem">
            <span class="stat-value" id="c-peers">0</span>
            <span class="stat-label">peers</span>
          </div>
        </div>
      </section>
    </aside>

    <div class="chat-area" role="region" aria-label="Chat com o enxame">
      <div class="chat-header">
        <div class="chat-status" id="chat-status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span>Conectado</span>
        </div>
        <div class="chat-actions">
          <button id="clear-chat" class="btn btn-ghost btn-sm" aria-label="Limpar conversa">🗑️</button>
          <button id="export-chat" class="btn btn-ghost btn-sm" aria-label="Exportar conversa">📥</button>
        </div>
      </div>

      <div class="transcript" id="transcript" role="log" aria-live="polite" aria-label="Histórico de mensagens">
        <div class="msg system welcome">
          <span class="msg-icon" aria-hidden="true">🐝</span>
          <span>Bem-vindo ao Enxame. Pergunte o que quiser.</span>
        </div>
      </div>

      <form class="input-row" id="chat-form" role="form" aria-label="Enviar mensagem">
        <label for="msg" class="sr-only">Sua pergunta</label>
        <input type="text" id="msg" placeholder="Pergunte ao enxame…" autocomplete="off" aria-describedby="msg-hint">
        <span id="msg-hint" class="sr-only">Pressione Enter para enviar</span>
        <button type="submit" id="send" class="btn btn-primary" aria-label="Enviar">ENVIAR</button>
      </form>
    </div>
  </main>

  <footer class="bottombar" role="contentinfo">
    <div class="bottombar-left">
      <span id="version-badge">v1.0.0</span>
      <span id="ollama-status" class="status-badge" aria-label="Status do Ollama">Ollama: —</span>
    </div>
    <div class="bottombar-right">
      <a href="https://github.com/istacb/enxamepublic" target="_blank" rel="noopener" class="github-link" aria-label="GitHub">⌘</a>
    </div>
  </footer>
</div>

<!-- Canvas layers (background + foreground) -->
<div class="canvas-layers" aria-hidden="true">
  <canvas id="hive-bg" class="hive-canvas"></canvas>
  <canvas id="hive-fg" class="hive-canvas"></canvas>
</div>

<!-- Audio context for bzz sounds -->
<audio id="sfx-bzz" preload="auto" aria-hidden="true"></audio>

<!-- Settings Modal -->
<div class="modal-overlay" id="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
  <div class="modal">
    <div class="modal-header">
      <h3 id="settings-title">⚙️ Configurações</h3>
      <button class="modal-close" id="settings-close" aria-label="Fechar">✕</button>
    </div>
    <div class="modal-body">
      <div class="setting-group">
        <label class="setting-label">Modo Offline</label>
        <label class="checkbox-wrap">
          <input type="checkbox" id="setting-offline" aria-label="Habilitar modo offline">
          <span>Desativar chamadas externas (Internet, Ollama remoto)</span>
        </label>
      </div>
      <div class="setting-group">
        <label class="setting-label">Fallback Web</label>
        <label class="checkbox-wrap">
          <input type="checkbox" id="setting-web-fallback" aria-label="Permitir fallback web">
          <span>Permitir busca na web quando não há resultado local</span>
        </label>
      </div>
      <div class="setting-group">
        <label class="setting-label">Limite de Confiança (RAG)</label>
        <div class="setting-row">
          <input type="range" id="setting-confidence" class="setting-input" min="0" max="1" step="0.05" value="0.7">
          <span id="confidence-value" style="font-family: var(--font-mono); min-width: 40px;">0.70</span>
        </div>
      </div>
      <div class="setting-group">
        <label class="setting-label" for="setting-model">Modelo Preferencial</label>
        <select id="setting-model" class="setting-select">
          <option value="auto">Automático (Recomendado)</option>
        </select>
      </div>
      <div class="setting-group">
        <label class="setting-label">Tamanho da Favo (Canvas)</label>
        <div class="setting-row">
          <input type="range" id="setting-hex-size" class="setting-input" min="16" max="48" step="2" value="28">
          <span id="hex-size-value" style="font-family: var(--font-mono); min-width: 40px;">28px</span>
        </div>
      </div>
      <div class="setting-group">
        <label class="setting-label">Animações</label>
        <label class="checkbox-wrap">
          <input type="checkbox" id="setting-animations" checked aria-label="Habilitar animações">
          <span>Ativar animações das abelhas e partículas</span>
        </label>
      </div>
      <div class="setting-group">
        <label class="setting-label">Sons</label>
        <label class="checkbox-wrap">
          <input type="checkbox" id="setting-sounds" checked aria-label="Habilitar sons">
          <span>Efeitos sonoros (bzz, notificações)</span>
        </label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="settings-reset">Restaurar Padrões</button>
      <button class="btn btn-primary" id="settings-save">Salvar</button>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
