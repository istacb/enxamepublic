[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enxame-bee"
version = "1.0.0"
description = "ENXAME Bee - Abelha Standalone Autônoma"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Enxame Team", email = "team@enxame.dev"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
# Obrigatórios de verdade: o que o código importa SEM guarda try/except,
# conferido por varredura AST de todos os .py do repositório.
#
# Saíram daqui PyYAML, torch, numpy, ollama, platformdirs e rich: nenhum tem um
# único import em qualquer arquivo. O cliente do Ollama fala HTTP via httpx
# (core/ollama/client.py), então o pacote `ollama` nunca foi usado; torch e numpy
# só chegariam de carona com sentence-transformers, que é extra (abaixo).
#
# O efeito prático é grande: `pip install -e bees` deixava de baixar gigabytes
# (torch + lancedb + sentence-transformers) para instalar um serviço que sobe e
# funciona sem nada disso — e a CI, que roda `pip install -e ".[dev]"`, pagava o
# mesmo custo em toda execução.
dependencies = [
    "aiohttp>=3.9.0",
    "cryptography>=42.0.0",
    "httpx>=0.26.0",
    "psutil>=5.9.0",
    "pydantic>=2.6.0",
    "zeroconf>=0.38.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
]
zim = ["zimply>=0.1.0"]
# RAG vetorial e embeddings locais. sentence-transformers arrasta o torch
# (gigabytes), por isso é extra e não dependência: sem ele a abelha funciona e
# cai no índice por palavra-chave, avisando no log ("LanceDB indisponível").
rag = [
    "lancedb>=0.8.0",
    "pyarrow>=14.0.0",
    "sentence-transformers>=3.0.0",
]
# OCR de imagens e PDFs escaneados. Precisa TAMBÉM do binário tesseract no
# sistema (apt install tesseract-ocr tesseract-ocr-por).
ocr = [
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
]
# Leitores usados por bibliotecario/universal_reader.py. Cada um é importado
# dentro de try/except: sem ele, aquele formato é pulado com aviso no log.
docs = [
    "PyMuPDF>=1.23.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1.0",
    "odfpy>=1.4.0",
    "mutagen>=1.47.0",
]
# Detecção de GPU NVIDIA; instalador e descoberta de capacidades degradam para
# CPU sem eles.
gpu = [
    "GPUtil>=1.4.0",
    "nvidia-ml-py>=12.535.0",
]
# Tudo que é opcional, para quem quer a abelha completa numa máquina só.
all = [
    "zimply>=0.1.0",
    "lancedb>=0.8.0",
    "pyarrow>=14.0.0",
    "sentence-transformers>=3.0.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "PyMuPDF>=1.23.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1.0",
    "odfpy>=1.4.0",
    "mutagen>=1.47.0",
    "GPUtil>=1.4.0",
    "nvidia-ml-py>=12.535.0",
]

[project.scripts]
bee = "bees.cli:main"

# Este pyproject.toml fica DENTRO de bees/, então a raiz de busca tem que ser o
# diretório pai. Com where = ["."] o setuptools procurava pacotes "bees*" dentro
# de bees/ e não encontrava NENHUM: `pip install -e bees` terminava com sucesso
# mas `import bees` dava ModuleNotFoundError, quebrando também o entrypoint
# `bee = "bees.cli:main"` (bee start / bee query / bee status).
# Verificado: find_packages(where=".") -> []   |   find_packages(where="..")
# -> ['bees', 'bees.capabilities', 'bees.cluster', 'bees.protocol']
[tool.setuptools.packages.find]
where = [".."]
include = ["bees*"]
exclude = ["bees.tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# rootdir é bees/ (onde este pyproject.toml está), então o caminho é relativo a
# ele. "bees/tests" apontava para bees/bees/tests (inexistente) e, sem testpaths
# válido, um `pytest` simples varria a árvore inteira.
# install/ entra de propósito: os testes dos instaladores existiam mas NUNCA
# eram executados (a CI rodava só `pytest tests/`), e foi assim que três deles
# apodreceram até falhar sem que ninguém notasse.
testpaths = ["tests", "install"]
python_files = "test_*.py"
python_functions = "test_*"

[tool.ruff]
line-length = 100
target-version = "py310"

# select/ignore estavam no nível [tool.ruff], forma que o ruff marcou como
# deprecated (o aviso aparecia em toda execução da CI) e que será removida.
[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T20"]
# S101 não faz parte do select acima (regras "S" não estão habilitadas), mas é
# mantido aqui por documentar a intenção de permitir assert em testes.
ignore = ["S101", "T201"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true